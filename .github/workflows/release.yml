# リリース用のワークフロー。
#
# 再作成の途中のため、まだ自動では走らせない。
# 配布できる実行ファイルが揃うのはフェーズ 4 以降であり、
# 中身はフェーズ 8 で組み直す（doc/rebuild/05-REBUILD_PLAN.md 第 6 節）。
#
# それまでのあいだ、タグを push しても何も起きないよう、
# 起動を手動（workflow_dispatch）だけに絞ってある。
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Not ready yet
        run: |
          Write-Host "リリースの組み立てはフェーズ 8 で用意します。"
          Write-Host "doc/rebuild/05-REBUILD_PLAN.md 第 6 節を参照してください。"
