name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Rust の版数は直下の rust-toolchain.toml で固定している
      - name: Show toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            tools/shelfy-migrate/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'tools/shelfy-migrate/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm ci

      # --- バックエンド ---

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test --all-targets

      # --- 移行ツール ---

      # 配布物には含めないが、リリースノートが利用者に案内する経路なので検査する
      - name: Format (migration tool)
        working-directory: tools/shelfy-migrate
        run: cargo fmt --check

      - name: Clippy (migration tool)
        working-directory: tools/shelfy-migrate
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (migration tool)
        working-directory: tools/shelfy-migrate
        run: cargo test

      # --- フロントエンド ---

      # 型検査とビルド。tauri build は release のみで行う（時間がかかるため）
      - name: Check and build frontend
        run: npm run build

  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # cargo-audit は CLI で呼ぶ。
      # rustsec/audit-check はチェック実行を作るため checks:write が要り、
      # fork からの PR では権限が下がって必ず失敗する。結果はログで足りる。
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # 脆弱性があれば失敗する。unmaintained と unsound の警告は落とさずに出すだけにする。
      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock

      - name: Audit migration tool dependencies
        run: cargo audit --file tools/shelfy-migrate/Cargo.lock

      - name: Audit npm dependencies
        run: npm audit --audit-level=high
