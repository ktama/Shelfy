[package]
name = "shelfy"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "棚でファイル、フォルダ、URL の参照を整理する常駐型ランチャー"
license = "MIT"

[lib]
name = "shelfy"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# ポートの試験用実装を、この crate の外からも使えるようにする
testing = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
# 結合テストからも試験用の実装を使う
shelfy = { path = ".", features = ["testing"] }

# 03-ARCHITECTURE.md 第 12 節のサイズ最適化設定
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
