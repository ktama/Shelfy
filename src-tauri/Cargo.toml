[package]
name = "shelfy"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "棚でファイル、フォルダ、URL の参照を整理する常駐型ランチャー"
license = "MIT"

[lib]
name = "shelfy"
path = "src/lib.rs"

[features]
# ポートの試験用実装を、この crate の外からも使えるようにする
testing = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }

[dev-dependencies]
tempfile = "3"
# 結合テストからも試験用の実装を使う
shelfy = { path = ".", features = ["testing"] }

# 03-ARCHITECTURE.md 第 12 節のサイズ最適化設定
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
