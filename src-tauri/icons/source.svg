<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="1024" height="1024">
  <!-- Shelfy アプリアイコンの原本（48 グリッド）。
       棚板 1 枚に背表紙 3 冊。右の 1 冊を傾けて、棒グラフに見えないようにしている。
       色は doc/DESIGN.md の「アイコン」節に対応する。
       ラスタライザが OKLCH を読めないことがあるため、16 進で書く。
         #D37814 = oklch(66% 0.15 60)   深い琥珀
         #F2B036 = oklch(80% 0.15 78)   琥珀
         #F5DC98 = oklch(90% 0.09 90)   淡い蜂蜜色
         #574336 = oklch(40% 0.035 55)  棚板 -->
  <rect x="4" y="34" width="40" height="5" rx="1.5" fill="#574336"/>

  <rect x="9" y="9" width="8" height="25" rx="1" fill="#D37814"/>
  <rect x="9" y="13" width="8" height="2.5" fill="#F5DC98"/>

  <rect x="18" y="16" width="7" height="18" rx="1" fill="#F2B036"/>
  <rect x="18" y="20" width="7" height="2" fill="#D37814"/>

  <!-- 左下の角を支点に 20° 傾け、左の辺を中央の本の右上の角に預ける -->
  <g transform="translate(31.55 34) rotate(-20)">
    <rect x="0" y="-22" width="7" height="22" rx="1" fill="#F5DC98"/>
    <rect x="0" y="-18" width="7" height="2" fill="#D37814"/>
  </g>
</svg>
