[package]
name = "shelfy-migrate"
version = "0.1.0"
edition = "2021"
description = "v1.0.0 の shelfy.db を、交換形式の JSON へ書き出す一度きりの道具"
license = "MIT"
publish = false

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
strip = true
